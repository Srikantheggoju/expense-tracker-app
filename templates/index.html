<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>Expense Tracker</h1>

    <form method="POST">

        <input
            type="text"
            name="item"
            placeholder="Expense Name"
            required>

        <input
            type="number"
            name="amount"
            placeholder="Amount"
            required>

        <button type="submit">
            Add Expense
        </button>

    </form>

    <h2>Expenses</h2>

    <table>

        <tr>
            <th>Item</th>
            <th>Amount</th>
        </tr>

        {% for expense in expenses %}
        <tr>
            <td>{{ expense.item }}</td>
            <td>{{ expense.amount }}</td>
        </tr>
        {% endfor %}

    </table>

    <h3>Total: ₹{{ total }}</h3>

</div>

</body>
</html>
